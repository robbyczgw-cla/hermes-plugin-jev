[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-plugin-jev"
version = "0.1.0"
description = "Bounded TypeSafe/Jev semantic decisions for Hermes Agent"
requires-python = ">=3.11"
dependencies = ["typesafe-sdk>=0.6.0,<0.7"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]

[project.urls]
Repository = "https://github.com/robbyczgw-cla/hermes-plugin-jev"
Issues = "https://github.com/robbyczgw-cla/hermes-plugin-jev/issues"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11", "build>=1.2", "twine>=6", "PyYAML>=6,<7"]

[project.scripts]
jev-router = "jev_router.cli:main"

[tool.setuptools.packages.find]
include = ["jev_router*"]

[tool.setuptools.data-files]
"share/doc/hermes-plugin-jev" = ["PRIVACY.md", "THIRD_PARTY.md", "SECURITY.md", "CHANGELOG.md"]
"share/doc/hermes-plugin-jev/docs" = ["docs/reference.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
